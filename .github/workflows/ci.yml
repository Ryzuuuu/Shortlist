name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only checks code, it never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      # Production dependencies only: the remaining advisories are in dev tooling (see SECURITY.md).
      - name: Dependency audit (production, high and above)
        run: npm audit --omit=dev --audit-level=high

      # The build needs no secrets: the database client is created on first use.
      - name: Build
        run: npm run build
